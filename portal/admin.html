<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard · Studio admin</title>
<script>
/* set the theme BEFORE first paint so there is no flash of the wrong colours */
(function(){ var t='light'; try{ t=localStorage.getItem('portal-theme')||'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme',t); })();
</script>
<link rel="icon" href="../images/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F5F7">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AMANORSAC">
<link rel="stylesheet" href="../assets/portal.css">
<link rel="stylesheet" href="../assets/admin-charts.css">
<style>
  main{max-width:1180px}
  .headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .headrow .sub{font-size:15px}
  /* six cards, one row of meaning each: the same shape, the same
     comparison line, the same link out - so the row reads evenly */
  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
  @media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:640px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 13px;
    box-shadow:var(--shadow);display:grid;grid-template-columns:1fr;gap:3px;align-content:start;min-width:0;
    text-decoration:none;color:inherit;transition:transform .25s var(--ease-out),border-color .25s}
  .kpi:hover{transform:translateY(-2px);border-color:var(--accent)}
  .kpi .k{font-size:12.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}
  .kpi .k i{width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--tint,var(--accent-soft));color:var(--tone,var(--accent))}
  .kpi .k i svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kpi .k .q{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);font-size:10px;display:grid;place-items:center;color:var(--muted);cursor:help;flex:none}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;min-width:0}
  /* the sparkline sits under the number, full width, so a long figure never has to make room for it */
  .kpi .spark{width:100%;height:22px;display:block}
  .kpi .spark svg{width:100%;height:100%}
  .kpi .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .kpi .d + .d{margin-top:0}
  .kpi .d.up{color:var(--ok)} .kpi .d.down{color:var(--warn)}

  .grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:14px;align-items:start}
  @media (max-width:900px){ .grid{grid-template-columns:1fr} }
  .col{display:grid;gap:14px}
  .card{margin:0}
  .card-head{margin-bottom:12px}
  .card-head h2{font-size:17px}
  .card-head .hint{font-size:12.5px}
  .chart{position:relative;height:250px}
  .chart.short{height:190px}
  .toggles{display:flex;gap:6px;flex-wrap:wrap}
  .toggles button{font:inherit;font-size:12.5px;font-weight:500;color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .toggles button i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.35}
  .toggles button.on{color:var(--ink);border-color:transparent;background:var(--surface-2)}
  .toggles button.on i{opacity:1}
  .legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:0}
  .tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
  .tbl .who{font-weight:500}
  .tbl .sub{display:block;color:var(--muted);font-size:12px}
  .todo{list-style:none;margin:0;padding:0}
  .todo li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .todo li:last-child{border-bottom:0}
  .todo b{font-size:20px;font-weight:700;letter-spacing:-.02em;min-width:36px;font-variant-numeric:tabular-nums}
  .todo a{margin-left:auto;font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap}
  .todo .quiet{color:var(--muted);font-size:13.5px}
  .msg:empty{display:none}
  .setup{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="top" id="topbar"></header>
<main>
  <div class="headrow">
    <div>
      <p class="eyebrow">Studio admin</p>
      <h1>Dashboard</h1>
      <p class="sub" id="asof">The business, this period.</p>
    </div>
    <div class="range" id="range">
      <button type="button" data-d="7">7 days</button>
      <button type="button" data-d="30" class="on">30 days</button>
      <button type="button" data-d="90">90 days</button>
    </div>
  </div>

  <p class="msg" id="m" role="status" aria-live="polite"></p>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="col">
      <div class="card">
        <div class="card-head"><h2>Over time</h2><div class="toggles" id="toggles"></div></div>
        <div class="chart" id="bigchart"></div>
        <p class="hint" style="margin-top:8px">Money on the left axis, counts on the right.</p>
      </div>
      <div class="card">
        <div class="card-head"><h2>Downloads by source</h2><span class="legend"><span><i style="background:#FF9F0A"></i>Site</span><span><i style="background:#0071E3"></i>Hub</span></span></div>
        <div class="chart short" id="srcchart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Latest sales</h2><a class="hint" href="admin-analytics.html#money">All sales →</a></div>
        <table class="tbl"><tbody id="sales"></tbody></table>
      </div>
      <div class="card">
        <div class="card-head"><h2>Top apps</h2><span class="hint" id="topnote">by revenue in the period</span></div>
        <ul class="bars" id="apps"></ul>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <div class="card-head"><h2>Needs you</h2><span class="hint" id="todocount"></span></div>
        <ul class="todo" id="todo"></ul>
      </div>
      <div class="card">
        <div class="card-head"><h2>Where visits come from</h2><a class="hint" href="admin-analytics.html#site">Site →</a></div>
        <div id="channels"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>People</h2><a class="hint" href="admin-analytics.html#apps">Apps →</a></div>
        <ul class="bars" id="people"></ul>
      </div>
    </div>
  </div>
</main>

<script src="../assets/vendor/supabase-2.116.0.js"></script>
<script src="../assets/supabase-client.js"></script>
<script src="../assets/portal.js"></script>
<script src="../assets/charts.js"></script>
<script>
(async () => {
  const me = await requireAdmin(); if(!me) return;
  await mountChrome('admin');
  const sb = window.amanorsacClient();
  const m = $('#m');
  const esc = t => { const d=document.createElement('div'); d.textContent = t==null?'':t; return d.innerHTML; };
  const num = Charts.num, usd = Charts.usd, delta = Charts.delta;
  const when = t => new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  let days = 30;
  let NAMES = {};
  const appName = id => NAMES[id] || id;
  fetch('/catalog.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(c=>{ if(c&&c.apps) Object.keys(c.apps).forEach(k=>NAMES[k]=c.apps[k].name||k); }).catch(()=>{});

  /* Every word on this page means one thing. These are the meanings;
     the same text is in the glossary on the Analytics page. */
  const DEF = {
    revenue:  'Gross paid amount in dollars, apps and store together. Other currencies are listed beneath, never converted.',
    sales:    'Paid entitlements only. Free claims, comps, betas and test rows are not sales.',
    downloads:'Every completed app download, from the site and through the Hub, as one number. People is the distinct accounts or addresses behind them.',
    machines: 'Machines that activated a licence and checked in within the last 30 days. Hubs is installations of the Hub that sent a heartbeat in that time.',
    visitors: 'Distinct visitors on the public site in the period. Visits is sessions.',
    todo:     'Things waiting on you: applications, songs, reviews, receipts and invoices. Only what is non-zero is listed.'
  };
  const CUR = { ghs:'₵', ngn:'₦', zar:'R', kes:'KSh', usd:'$' };
  const others = obj => { const e = Object.entries(obj||{}); return e.length ? '<span class="d">+ '+e.map(([c,n])=>(CUR[c]||(c.toUpperCase()+' '))+(Number(n)/100).toLocaleString()).join(' · ')+'</span>' : ''; };

  const SERIES = [
    { key:'revenue_cents', label:'Revenue',   color:'#0071E3', money:true },
    { key:'sales',         label:'Sales',     color:'#30D158' },
    { key:'downloads',     label:'Downloads', color:'#FF9F0A' },
    { key:'visits',        label:'Visits',    color:'#BF5AF2' }
  ];
  const SRC = [ { key:'downloads_site', label:'Site', color:'#FF9F0A' }, { key:'downloads_hub', label:'Hub', color:'#0071E3' } ];
  let active = ['revenue_cents','visits'], daily = [];

  const ICON = {
    money:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.5 2.5-1.5s2.5.5 2.5 1.5-1 1.5-2.5 1.5-2.5.5-2.5 1.5 1 1.5 2.5 1.5 2.5-.5 2.5-1.5"/></svg>',
    tag:'<svg viewBox="0 0 24 24"><path d="M20 13L13 20 4 11V4h7z"/><circle cx="8" cy="8" r="1.5"/></svg>',
    down:'<svg viewBox="0 0 24 24"><path d="M12 4v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>',
    eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    chip:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>',
    bell:'<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>'
  };
  function kpi(o){
    return '<a class="kpi" href="'+o.href+'" style="--tone:'+o.color+';--tint:'+o.tint+'">' +
      '<span class="k"><i>'+ICON[o.icon]+'</i>'+o.k+'<span class="q" title="'+esc(o.def)+'">?</span></span>' +
      '<span class="v" title="'+esc(o.vt||'')+'">'+o.v+'</span>' +
      (o.spark ? '<span class="spark" data-spark="'+o.spark+'" data-c="'+o.color+'"></span>' : '<span></span>') +
      o.d + (o.sub||'') + '</a>';
  }
  function drawToggles(){
    $('#toggles').innerHTML = SERIES.map(s => '<button type="button" data-k="'+s.key+'" class="'+(active.indexOf(s.key)>=0?'on':'')+'" style="--c:'+s.color+'"><i></i>'+s.label+'</button>').join('');
    $$('#toggles button').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.k;
      if(active.indexOf(k)>=0){ if(active.length>1) active = active.filter(x=>x!==k); } else active.push(k);
      active = SERIES.map(s=>s.key).filter(k=>active.indexOf(k)>=0);
      drawToggles(); chart();
    }));
  }
  function chart(){ Charts.line($('#bigchart'), { days: daily, series: SERIES, active }); Charts.area($('#srcchart'), { days: daily, series: SRC }); }
  addEventListener('resize', chart);

  async function draw(){
    m.textContent = 'Reading…'; m.className = 'msg';
    const since = new Date(Date.now() - days*864e5).toISOString();
    const [ps, pd, as, ad, apps, acq, rec, sp, apps_pending, songs_pending, reviews, inv, revs, rcpt, pkg] = await Promise.all([
      sb.rpc('product_summary',    { p_days: days }),
      sb.rpc('product_daily',      { p_days: days }),
      sb.rpc('analytics_summary',  { p_days: days }),
      sb.rpc('analytics_daily',    { p_days: days }),
      sb.rpc('product_by_app',     { p_days: days }),
      sb.rpc('analytics_acquisition', { p_days: days }),
      sb.rpc('product_recent',     { p_limit: 8, p_paid_only: true }),
      sb.from('store_purchases').select('amount_cents,currency,kind,purchased_at,version_id,store_versions(store_songs(title),store_creators(name))').gte('purchased_at', since).order('purchased_at',{ascending:false}).limit(200),
      sb.from('creator_applications').select('id',{count:'exact',head:true}).eq('status','pending'),
      sb.from('store_versions').select('id',{count:'exact',head:true}).eq('status','submitted'),
      sb.rpc('app_reviews_pending'),
      sb.from('invoices').select('amount_cents,status'),
      sb.from('revision_requests').select('id',{count:'exact',head:true}).neq('status','done'),
      sb.from('invoices').select('id',{count:'exact',head:true}).eq('status','review'),
      sb.from('package_requests').select('id',{count:'exact',head:true}).eq('status','new')
    ]);
    const missing = [ps,pd,as,ad,apps,acq,rec].find(r => r && r.error);
    if(missing){
      m.textContent = /does not exist|schema cache|column/i.test(missing.error.message)
        ? 'A report is out of date: run supabase-admin-audit.sql in the SQL editor.'
        : missing.error.message;
      m.className = 'msg err';
    } else { m.textContent = ''; }

    const P = (ps.data && ps.data[0]) || {}, A = (as.data && as.data[0]) || {};
    /* one daily table: product numbers plus visits; store sales folded into revenue */
    const byDay = {};
    const blank = d => ({ day:d, revenue_cents:0, sales:0, downloads:0, downloads_site:0, downloads_hub:0, visits:0 });
    (pd.data||[]).forEach(r => { byDay[r.day] = Object.assign(blank(r.day), { revenue_cents:Number(r.revenue_cents)||0, sales:Number(r.sales)||0, downloads:Number(r.downloads)||0, downloads_site:Number(r.downloads_site)||0, downloads_hub:Number(r.downloads_hub)||0 }); });
    (ad.data||[]).forEach(r => { (byDay[r.day] = byDay[r.day] || blank(r.day)).visits = Number(r.visits)||0; });
    let storeRev = 0, storeN = 0;
    (sp.data||[]).forEach(p => {
      const d = String(p.purchased_at).slice(0,10);
      const row = byDay[d] = byDay[d] || blank(d);
      if(String(p.currency||'usd')==='usd' && Number(p.amount_cents)) { row.revenue_cents += Number(p.amount_cents)||0; storeRev += Number(p.amount_cents)||0; }
      if(Number(p.amount_cents)) { row.sales += 1; storeN += 1; }
    });
    daily = Object.values(byDay).sort((a,b)=>a.day<b.day?-1:1);
    const revenue = (Number(P.revenue_cents)||0) + storeRev, sales = (Number(P.sales)||0) + storeN;

    /* needs you: only what is non-zero */
    const owedRows = (inv.data||[]).filter(i=>i.status!=='paid'&&i.status!=='void');
    const owed = owedRows.reduce((t,i)=>t+i.amount_cents,0);
    const todo = [
      [apps_pending.count||0, 'creator application'+(apps_pending.count===1?'':'s')+' waiting', 'admin-store.html'],
      [songs_pending.count||0, 'song'+(songs_pending.count===1?'':'s')+' in review', 'admin-store.html'],
      [(pkg&&!pkg.error&&pkg.count)||0, 'Studio Bundle request'+(pkg&&pkg.count===1?'':'s')+' to answer', 'admin-store.html#applications'],
      [(reviews.data||[]).length, 'app review'+((reviews.data||[]).length===1?'':'s')+' to approve', 'admin-reviews.html#app-reviews'],
      [revs.count||0, 'open mix review'+(revs.count===1?'':'s'), 'admin-reviews.html'],
      [rcpt.count||0, 'receipt'+(rcpt.count===1?'':'s')+' to confirm', 'admin-billing.html'],
      [owedRows.length, 'invoice'+(owedRows.length===1?'':'s')+' awaiting payment · '+usd(owed), 'admin-billing.html']
    ].filter(t => t[0] > 0);
    $('#todo').innerHTML = todo.length
      ? todo.map(([n,l,h]) => '<li><b>'+n+'</b><span>'+l+'</span><a href="'+h+'">Open</a></li>').join('')
      : '<li class="quiet">Nothing waiting. Quiet is good.</li>';
    $('#todocount').textContent = todo.length ? todo.length+' thing'+(todo.length===1?'':'s') : '';

    $('#asof').textContent = 'The last '+days+' days, against the '+days+' before.';
    const hubPct = P.hub_share_pct==null ? '—' : Math.round(Number(P.hub_share_pct))+'%';
    $('#kpis').innerHTML =
      kpi({ k:'Revenue', v:usd(revenue), d:delta(revenue, P.prev_revenue_cents, {floor:2000}), sub:others(P.revenue_other), spark:'revenue_cents', color:'#0071E3', tint:'var(--accent-soft)', icon:'money', href:'admin-analytics.html#money', def:DEF.revenue }) +
      kpi({ k:'Sales', v:num(sales), d:delta(sales, P.prev_sales), sub:'<span class="d">paid only · '+num(P.free_claims)+' free claim'+(Number(P.free_claims)===1?'':'s')+'</span>', spark:'sales', color:'#30D158', tint:'var(--ok-soft)', icon:'tag', href:'admin-analytics.html#money', def:DEF.sales }) +
      kpi({ k:'Downloads', v:num(P.downloads), d:delta(P.downloads, P.prev_downloads), sub:'<span class="d">'+hubPct+' via Hub · '+num(P.people)+' people</span>', spark:'downloads', color:'#FF9F0A', tint:'#FFF3E0', icon:'down', href:'admin-analytics.html#apps', def:DEF.downloads }) +
      kpi({ k:'Active machines', v:num(P.machines_active), d:delta(P.machines_new, P.prev_machines_new), sub:'<span class="d">'+num(P.machines_new)+' new · '+num(P.hubs_active)+' Hub'+(Number(P.hubs_active)===1?'':'s')+' active</span>', color:'#64D2FF', tint:'#E5F6FF', icon:'chip', href:'admin-analytics.html#apps', def:DEF.machines }) +
      kpi({ k:'Visitors', v:num(A.visitors), d:delta(A.visitors, A.prev_visitors!=null?A.prev_visitors:A.prev_visits), sub:'<span class="d">'+num(A.visits)+' visits</span>', spark:'visits', color:'#BF5AF2', tint:'#F3E8FF', icon:'eye', href:'admin-analytics.html#site', def:DEF.visitors }) +
      kpi({ k:'Needs you', v:num(todo.length), d:'<span class="d">'+(todo.length ? esc(todo[0][1]) : 'nothing waiting')+'</span>', color:'#FF375F', tint:'#FFE5EA', icon:'bell', href:'#todo', def:DEF.todo });
    $$('[data-spark]').forEach(el => Charts.spark(el, daily.map(r => Number(r[el.dataset.spark])||0), el.dataset.c));
    drawToggles(); chart();

    /* latest sales: apps and songs, paid only, newest first */
    const list = [];
    (rec.data||[]).forEach(r => list.push({ at:r.at, who:r.email, what:appName(r.app), amount:r.amount_cents, cur:r.currency, kind:r.rail||r.kind }));
    (sp.data||[]).filter(p=>Number(p.amount_cents)).slice(0,8).forEach(p => list.push({ at:p.purchased_at, who:(p.store_versions&&p.store_versions.store_creators&&p.store_versions.store_creators.name)||'store',
      what:(p.store_versions&&p.store_versions.store_songs&&p.store_versions.store_songs.title)||'song', amount:p.amount_cents, cur:p.currency, kind:p.kind==='rent'?'14-day rental':'song' }));
    list.sort((a,b)=>a.at<b.at?1:-1);
    $('#sales').innerHTML = list.length ? list.slice(0,8).map(r =>
      '<tr><td><span class="who">'+esc(r.what)+'</span><span class="sub">'+esc(r.who)+' · '+esc(r.kind)+'</span></td>' +
      '<td class="n">'+(String(r.cur||'usd').toLowerCase()==='usd' ? usd(r.amount) : (Number(r.amount)/100).toLocaleString()+' '+String(r.cur).toUpperCase())+'</td>' +
      '<td class="n" style="color:var(--muted)">'+esc(when(r.at))+'</td></tr>').join('')
      : '<tr><td class="empty">No paid sales in this period.</td></tr>';

    /* top apps: by revenue when anything sold; by downloads when not, and said so */
    const rows = (apps.data||[]);
    const sold = rows.filter(r=>Number(r.revenue_cents)>0).sort((a,b)=>b.revenue_cents-a.revenue_cents).slice(0,7);
    if(sold.length){
      $('#topnote').textContent = 'by revenue in the period';
      Charts.bars($('#apps'), sold, { label:r=>appName(r.app), value:r=>r.revenue_cents, note:r=>usd(r.revenue_cents)+' <span style="opacity:.6">· '+num(r.sales)+' sale'+(Number(r.sales)===1?'':'s')+' · '+num(r.downloads)+' downloads</span>' });
    } else {
      $('#topnote').textContent = 'by downloads · nothing sold in the period';
      Charts.bars($('#apps'), rows.filter(r=>Number(r.downloads)).sort((a,b)=>b.downloads-a.downloads).slice(0,7),
        { label:r=>appName(r.app), value:r=>r.downloads, color:'#FF9F0A', note:r=>num(r.downloads)+' <span style="opacity:.6">· '+num(r.people)+' people</span>' });
    }

    /* channels as a ring: visits, and the centre says so */
    const ch = (acq.data||[]).filter(r=>r.kind==='channel').sort((a,b)=>b.visits-a.visits);
    const palette = ['#0071E3','#30D158','#FF9F0A','#BF5AF2','#FF375F','#64D2FF','#8E8E93'];
    Charts.ring($('#channels'), ch.slice(0,6).map((r,i)=>({ label:r.label, value:r.visits, color:palette[i%palette.length] })), { centre: Charts.short(A.visits||0)+' visits' });

    /* people, in one column of meaning */
    Charts.bars($('#people'), [
      { label:'Visitors', value:A.visitors },
      { label:'New accounts', value:P.new_accounts },
      { label:'People who downloaded', value:P.people },
      { label:'Accounts with the Hub', value:P.hubs_signed_in },
      { label:'Paid', value:sales }
    ], { color:'#BF5AF2' });
  }

  $$('#range button').forEach(b => b.addEventListener('click', () => {
    $$('#range button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    days = Number(b.dataset.d); draw();
  }));
  draw();
})();
</script>
</body>
</html>
