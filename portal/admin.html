<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard · Studio admin</title>
<script>
/* set the theme BEFORE first paint so there is no flash of the wrong colours */
(function(){ var t='light'; try{ t=localStorage.getItem('portal-theme')||'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme',t); })();
</script>
<link rel="icon" href="../images/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F5F7">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AMANORSAC">
<link rel="stylesheet" href="../assets/portal.css">
<link rel="stylesheet" href="../assets/admin-charts.css">
<style>
  main{max-width:1180px}
  .headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .headrow .sub{font-size:15px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
  @media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:480px){ .kpis{grid-template-columns:1fr} }
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 14px;
    box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:end;
    text-decoration:none;color:inherit;transition:transform .25s var(--ease-out),border-color .25s}
  .kpi:hover{transform:translateY(-2px);border-color:var(--accent)}
  .kpi .k{grid-column:1/-1;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
  .kpi .k i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--tint,var(--accent-soft));color:var(--tone,var(--accent))}
  .kpi .k i svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kpi .v{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
  .kpi .spark{width:110px;height:34px}
  .kpi .d{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:2px}
  .kpi .d.up{color:var(--ok)} .kpi .d.down{color:var(--warn)}

  .grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:14px;align-items:start}
  @media (max-width:900px){ .grid{grid-template-columns:1fr} }
  .col{display:grid;gap:14px}
  .card{margin:0}
  .card-head{margin-bottom:12px}
  .card-head h2{font-size:17px}
  .card-head .hint{font-size:12.5px}
  .chart{position:relative;height:260px}
  .toggles{display:flex;gap:6px;flex-wrap:wrap}
  .toggles button{font:inherit;font-size:12.5px;font-weight:500;color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .toggles button i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.35}
  .toggles button.on{color:var(--ink);border-color:transparent;background:var(--surface-2)}
  .toggles button.on i{opacity:1}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:0}
  .tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
  .tbl .who{font-weight:500}
  .tbl .sub{display:block;color:var(--muted);font-size:12px}
  .todo{list-style:none;margin:0;padding:0}
  .todo li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .todo li:last-child{border-bottom:0}
  .todo b{font-size:20px;font-weight:700;letter-spacing:-.02em;min-width:36px;font-variant-numeric:tabular-nums}
  .todo a{margin-left:auto;font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap}
  .todo .zero{color:var(--muted)}
  .msg:empty{display:none}
  .setup{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="top" id="topbar"></header>
<main>
  <div class="headrow">
    <div>
      <p class="eyebrow">Studio admin</p>
      <h1>Dashboard</h1>
      <p class="sub" id="asof">The business, this period.</p>
    </div>
    <div class="range" id="range">
      <button type="button" data-d="7">7 days</button>
      <button type="button" data-d="30" class="on">30 days</button>
      <button type="button" data-d="90">90 days</button>
    </div>
  </div>

  <p class="msg" id="m" role="status" aria-live="polite"></p>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="col">
      <div class="card">
        <div class="card-head"><h2>Over time</h2><div class="toggles" id="toggles"></div></div>
        <div class="chart" id="bigchart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Latest sales</h2><a class="hint" href="admin-analytics.html#money">All sales →</a></div>
        <table class="tbl"><tbody id="sales"></tbody></table>
      </div>
      <div class="card">
        <div class="card-head"><h2>Top apps</h2><span class="hint">by revenue in the period</span></div>
        <ul class="bars" id="apps"></ul>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <div class="card-head"><h2>Needs you</h2></div>
        <ul class="todo" id="todo"></ul>
      </div>
      <div class="card">
        <div class="card-head"><h2>Where visitors come from</h2><a class="hint" href="admin-analytics.html#traffic">Traffic →</a></div>
        <div id="channels"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Store</h2><a class="hint" href="admin-store.html">Review queue →</a></div>
        <ul class="bars" id="store"></ul>
      </div>
      <div class="card">
        <div class="card-head"><h2>Hub</h2><a class="hint" href="admin-analytics.html#money">Installed base →</a></div>
        <div id="hub"></div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/vendor/supabase-2.116.0.js"></script>
<script src="../assets/supabase-client.js"></script>
<script src="../assets/portal.js"></script>
<script src="../assets/charts.js"></script>
<script>
(async () => {
  const me = await requireAdmin(); if(!me) return;
  await mountChrome('admin');
  const sb = window.amanorsacClient();
  const m = $('#m');
  const esc = t => { const d=document.createElement('div'); d.textContent = t==null?'':t; return d.innerHTML; };
  const num = Charts.num, usd = Charts.usd;
  const when = t => new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  let days = 30;
  let NAMES = {};
  const appName = id => NAMES[id] || id;
  fetch('/catalog.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(c=>{ if(c&&c.apps) Object.keys(c.apps).forEach(k=>NAMES[k]=c.apps[k].name||k); }).catch(()=>{});

  const SERIES = [
    { key:'revenue_cents', label:'Revenue',   color:'#0071E3', money:true },
    { key:'sales',         label:'Sales',     color:'#30D158' },
    { key:'downloads',     label:'Downloads', color:'#FF9F0A' },
    { key:'visits',        label:'Visits',    color:'#BF5AF2' }
  ];
  let active = ['revenue_cents','visits'], daily = [];

  function delta(now, before, lowerIsBetter){
    now = Number(now)||0; before = Number(before)||0;
    if(!before) return now ? '<span class="d">new this period</span>' : '<span class="d">—</span>';
    const ch = Math.round((now-before)/before*100);
    if(!isFinite(ch)||ch===0) return '<span class="d">level with the period before</span>';
    const good = lowerIsBetter ? ch<0 : ch>0;
    return '<span class="d '+(good?'up':'down')+'">'+(ch>0?'▲':'▼')+' '+Math.abs(ch)+'% vs the period before</span>';
  }
  const ICON = {
    money:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.5 2.5-1.5s2.5.5 2.5 1.5-1 1.5-2.5 1.5-2.5.5-2.5 1.5 1 1.5 2.5 1.5 2.5-.5 2.5-1.5"/></svg>',
    tag:'<svg viewBox="0 0 24 24"><path d="M20 13L13 20 4 11V4h7z"/><circle cx="8" cy="8" r="1.5"/></svg>',
    down:'<svg viewBox="0 0 24 24"><path d="M12 4v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>',
    eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
  };
  function kpi(k, v, d, sparkKey, color, tint, icon, href){
    return '<a class="kpi" href="'+href+'" style="--tone:'+color+';--tint:'+tint+'"><span class="k"><i>'+ICON[icon]+'</i>'+k+'</span>' +
      '<span class="v">'+v+'</span><span class="spark" data-spark="'+sparkKey+'" data-c="'+color+'"></span>'+d+'</a>';
  }
  function drawToggles(){
    $('#toggles').innerHTML = SERIES.map(s => '<button type="button" data-k="'+s.key+'" class="'+(active.indexOf(s.key)>=0?'on':'')+'" style="--c:'+s.color+'"><i></i>'+s.label+'</button>').join('');
    $$('#toggles button').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.k;
      if(active.indexOf(k)>=0){ if(active.length>1) active = active.filter(x=>x!==k); } else active.push(k);
      active = SERIES.map(s=>s.key).filter(k=>active.indexOf(k)>=0);
      drawToggles(); chart();
    }));
  }
  function chart(){ Charts.line($('#bigchart'), { days: daily, series: SERIES, active }); }
  addEventListener('resize', chart);

  async function draw(){
    m.textContent = 'Reading…'; m.className = 'msg';
    const since = new Date(Date.now() - days*864e5).toISOString();
    const [ps, pd, as, ad, apps, acq, rec, hub, sp, apps_pending, songs_pending, reviews, inv, revs] = await Promise.all([
      sb.rpc('product_summary',    { p_days: days }),
      sb.rpc('product_daily',      { p_days: days }),
      sb.rpc('analytics_summary',  { p_days: days }),
      sb.rpc('analytics_daily',    { p_days: days }),
      sb.rpc('product_by_app',     { p_days: days }),
      sb.rpc('analytics_acquisition', { p_days: days }),
      sb.rpc('product_recent',     { p_limit: 8 }),
      sb.rpc('product_hub'),
      sb.from('store_purchases').select('amount_cents,currency,kind,purchased_at,version_id,store_versions(store_songs(title),store_creators(name))').gte('purchased_at', since).order('purchased_at',{ascending:false}).limit(200),
      sb.from('creator_applications').select('id',{count:'exact',head:true}).eq('status','pending'),
      sb.from('store_versions').select('id',{count:'exact',head:true}).eq('status','submitted'),
      sb.rpc('app_reviews_pending'),
      sb.from('invoices').select('amount_cents,status'),
      sb.from('revision_requests').select('id',{count:'exact',head:true}).neq('status','done')
    ]);
    const missing = [ps,pd,as,ad,apps,acq,rec].find(r => r && r.error);
    if(missing){
      m.textContent = /does not exist|schema cache/i.test(missing.error.message)
        ? 'A report is not installed: run supabase-product-analytics.sql and supabase-analytics.sql in the SQL editor.'
        : missing.error.message;
      m.className = 'msg err';
    } else { m.textContent = ''; }

    const P = (ps.data && ps.data[0]) || {}, A = (as.data && as.data[0]) || {};
    /* one daily table: product numbers plus visits, store sales folded into revenue */
    const byDay = {};
    (pd.data||[]).forEach(r => { byDay[r.day] = { day:r.day, revenue_cents:Number(r.revenue_cents)||0, sales:Number(r.sales)||0, downloads:Number(r.downloads)||0, visits:0 }; });
    (ad.data||[]).forEach(r => { (byDay[r.day] = byDay[r.day] || { day:r.day, revenue_cents:0, sales:0, downloads:0, visits:0 }).visits = Number(r.visits)||0; });
    let storeRev = 0, storeN = 0;
    (sp.data||[]).forEach(p => {
      const d = String(p.purchased_at).slice(0,10);
      const row = byDay[d] = byDay[d] || { day:d, revenue_cents:0, sales:0, downloads:0, visits:0 };
      if(String(p.currency||'usd')==='usd') { row.revenue_cents += Number(p.amount_cents)||0; storeRev += Number(p.amount_cents)||0; }
      row.sales += 1; storeN += 1;
    });
    daily = Object.values(byDay).sort((a,b)=>a.day<b.day?-1:1);
    const sum = k => daily.reduce((n,r)=>n+(Number(r[k])||0),0);
    const revenue = (Number(P.revenue_cents)||0) + storeRev, sales = (Number(P.sales)||0) + storeN;

    $('#asof').textContent = 'The last '+days+' days, against the '+days+' before.';
    $('#kpis').innerHTML =
      kpi('Revenue',   usd(revenue),          delta(revenue, P.prev_revenue_cents), 'revenue_cents', '#0071E3', 'var(--accent-soft)', 'money', 'admin-analytics.html#money') +
      kpi('Sales',     num(sales),            delta(sales, P.prev_sales),          'sales',         '#30D158', 'var(--ok-soft)',     'tag',   'admin-analytics.html#money') +
      kpi('Downloads', num(P.downloads),      delta(P.downloads, P.prev_downloads), 'downloads',    '#FF9F0A', '#FFF3E0',            'down',  'admin-analytics.html#downloads') +
      kpi('Visitors',  num(A.visitors),       delta(A.visits, A.prev_visits),       'visits',       '#BF5AF2', '#F3E8FF',            'eye',   'admin-analytics.html#traffic');
    $$('[data-spark]').forEach(el => Charts.spark(el, daily.map(r => Number(r[el.dataset.spark])||0), el.dataset.c));
    drawToggles(); chart();

    /* latest sales: apps and songs, one list, newest first */
    const list = [];
    (rec.data||[]).forEach(r => list.push({ at:r.at, who:r.email, what:appName(r.app), amount:r.amount_cents, cur:r.currency, kind:r.kind }));
    (sp.data||[]).slice(0,8).forEach(p => list.push({ at:p.purchased_at, who:(p.store_versions&&p.store_versions.store_creators&&p.store_versions.store_creators.name)||'store',
      what:(p.store_versions&&p.store_versions.store_songs&&p.store_versions.store_songs.title)||'song', amount:p.amount_cents, cur:p.currency, kind:p.kind==='rent'?'14-day rental':'song' }));
    list.sort((a,b)=>a.at<b.at?1:-1);
    $('#sales').innerHTML = list.length ? list.slice(0,8).map(r =>
      '<tr><td><span class="who">'+esc(r.what)+'</span><span class="sub">'+esc(r.who)+' · '+esc(r.kind)+'</span></td>' +
      '<td class="n">'+(Number(r.amount) ? (String(r.cur||'usd').toLowerCase()==='usd' ? usd(r.amount) : (Number(r.amount)/100).toLocaleString()+' '+String(r.cur).toUpperCase()) : 'free')+'</td>' +
      '<td class="n" style="color:var(--muted)">'+esc(when(r.at))+'</td></tr>').join('')
      : '<tr><td class="empty">No sales in this period.</td></tr>';

    /* top apps */
    Charts.bars($('#apps'), (apps.data||[]).filter(r=>Number(r.revenue_cents)||Number(r.downloads)).sort((a,b)=>b.revenue_cents-a.revenue_cents).slice(0,7),
      { label:r=>appName(r.app), value:r=>r.revenue_cents, note:r=>usd(r.revenue_cents)+' <span style="opacity:.6">· '+num(r.downloads)+' downloads</span>' });

    /* needs you */
    const owed = (inv.data||[]).filter(i=>i.status!=='paid'&&i.status!=='void').reduce((t,i)=>t+i.amount_cents,0);
    const todo = [
      [apps_pending.count||0, 'creator application'+(apps_pending.count===1?'':'s')+' waiting', 'admin-store.html'],
      [songs_pending.count||0, 'song'+(songs_pending.count===1?'':'s')+' in review', 'admin-store.html'],
      [(reviews.data||[]).length, 'app review'+((reviews.data||[]).length===1?'':'s')+' to approve', 'admin-analytics.html#downloads'],
      [revs.count||0, 'open mix review'+(revs.count===1?'':'s'), 'admin-reviews.html'],
      [owed ? usd(owed) : 0, 'awaiting payment', 'admin-billing.html']
    ];
    $('#todo').innerHTML = todo.map(([n,l,h]) => '<li><b class="'+(n?'':'zero')+'">'+n+'</b><span>'+l+'</span><a href="'+h+'">Open</a></li>').join('');

    /* channels as a ring */
    const ch = (acq.data||[]).filter(r=>r.kind==='channel').sort((a,b)=>b.visits-a.visits);
    const palette = ['#0071E3','#30D158','#FF9F0A','#BF5AF2','#FF375F','#64D2FF','#8E8E93'];
    Charts.ring($('#channels'), ch.slice(0,6).map((r,i)=>({ label:r.label, value:r.visits, color:palette[i%palette.length] })), { centre: Charts.short(A.visits||0) });

    /* store */
    const rentals = (sp.data||[]).filter(p=>p.kind==='rent').length;
    Charts.bars($('#store'), [
      { label:'Song sales', value: storeN },
      { label:'of which rentals', value: rentals },
      { label:'Applications waiting', value: apps_pending.count||0 },
      { label:'Songs in review', value: songs_pending.count||0 }
    ], { color:'#BF5AF2' });

    /* hub */
    const H = (hub.data && hub.data[0]) || null;
    $('#hub').innerHTML = H && Number(H.installs)
      ? '<ul class="bars"><li><span class="lab">Installations</span><span class="num">'+num(H.installs)+'</span><span class="track"><i style="width:100%"></i></span></li>' +
        '<li><span class="lab">Seen in the last 30 days</span><span class="num">'+num(H.active_30d)+'</span><span class="track"><i style="width:'+Math.round(100*H.active_30d/H.installs)+'%"></i></span></li>' +
        '<li><span class="lab">On '+esc(H.current_version||'the latest')+'</span><span class="num">'+num(H.on_current)+'</span><span class="track"><i style="width:'+Math.round(100*H.on_current/H.installs)+'%"></i></span></li></ul>'
      : '<p class="setup">No Hub has reported in yet.</p>';
  }

  $$('#range button').forEach(b => b.addEventListener('click', () => {
    $$('#range button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    days = Number(b.dataset.d); draw();
  }));
  draw();
})();
</script>
</body>
</html>
