<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mix reviews · Studio admin</title>
<script>
/* set the theme BEFORE first paint so there is no flash of the wrong colours */
(function(){ var t='light'; try{ t=localStorage.getItem('portal-theme')||'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme',t); })();
</script>
<link rel="icon" href="../images/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F5F1">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AMANORSAC">
<link rel="stylesheet" href="../assets/portal.css">
<style>
  .note{background:var(--surface-2);border-radius:8px;padding:12px 14px;margin:8px 0;font-size:14px}
  .note p{margin:0 0 4px}
  .note .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .rev{border-bottom:1px solid var(--line);padding:18px 0}
  .rev:last-child{border-bottom:0}
  /* app reviews waiting on a yes or no - moved here from Analytics,
     because this is the page where things are reviewed */
  .rv-mod{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px}
  .rv-mod-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
  .rv-mod-app{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 9px}
  .rv-mod-stars{color:#FF9F0A;letter-spacing:1px;font-size:13px}
  .rv-mod-who{font-size:12.5px;color:var(--muted)}
  .rv-mod-body{margin:0 0 10px;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .rv-mod-btns{display:flex;gap:8px}
  .rv-mod-btns button{font:inherit;font-size:13px;font-weight:500;cursor:pointer;border-radius:999px;padding:6px 14px;border:1px solid var(--line);background:none;color:var(--ink)}
  .rv-mod-btns button.ok{border-color:var(--ok);color:var(--ok)} .rv-mod-btns button.no{border-color:var(--warn);color:var(--warn)}
  .rv-mod-btns button[disabled]{opacity:.5;cursor:default}
  .msg:empty{display:none}
</style>
</head>
<body>
<header class="top" id="topbar"></header>
<main>
  <div class="head">
    <p class="eyebrow">Studio admin</p>
    <h1>Mix reviews</h1>
    <p class="sub">What clients are asking for, newest first. Open rounds sit on top; change the status here as you work through them. App reviews waiting for approval are at the bottom.</p>
  </div>
  <p class="msg" id="m" role="status" aria-live="polite"></p>
  <div class="card">
    <div class="card-head"><h2>All rounds</h2><span class="hint" id="count"></span></div>
    <div id="revs"><div class="skeleton" style="width:50%"></div></div>
  </div>
  <div class="card" id="app-reviews" style="margin-top:16px">
    <div class="card-head"><h2>App reviews awaiting approval</h2><span class="pill" id="rvcount"></span></div>
    <div id="rvlist"><p class="empty">Reading…</p></div>
  </div>
</main>
<script src="../assets/vendor/supabase-2.116.0.js"></script>
<script src="../assets/supabase-client.js"></script>
<script src="../assets/portal.js"></script>
<script>
(async () => {
  const me = await requireAdmin(); if(!me) return;
  await mountChrome('admin-reviews');

  async function load(){
    const { data: revs, error } = await sb.from('revision_requests')
      .select('*, revision_notes(*), projects(title, profiles!projects_client_id_fkey(full_name,email))')
      .order('created_at', {ascending:false});

    if(error){
      $('#revs').innerHTML = '<p class="empty">Could not load reviews: '+esc(error.message)+'</p>';
      return;
    }

    // Open work first; within each group, newest first (already sorted).
    const rank = { open:0, in_progress:1, done:2 };
    const list = (revs||[]).slice().sort((a,b) =>
      (rank[a.status] ?? 9) - (rank[b.status] ?? 9));

    const openCount = list.filter(r => r.status !== 'done').length;
    $('#count').textContent = openCount + ' open · ' + list.length + ' total';

    $('#revs').innerHTML = list.length ? list.map(r => {
      const proj = r.projects || {};
      const who  = proj.profiles ? (proj.profiles.full_name || proj.profiles.email) : '';
      const notes = (r.revision_notes||[]).map(n =>
        '<div class="note">'+
          (n.timecode ? '<p class="lbl">'+esc(n.timecode)+(n.element?' · '+esc(n.element):'')+'</p>'
                      : (n.element?'<p class="lbl">'+esc(n.element)+'</p>':''))+
          (n.hearing ? '<p><b>Hearing:</b> '+esc(n.hearing)+'</p>' : '')+
          (n.wanted  ? '<p><b>Wants:</b> '+esc(n.wanted)+'</p>' : '')+
          (n.reference_url ? '<p>'+linkHtml(n.reference_url,'Reference')+'</p>' : '')+
          (n.priority ? '<p class="lbl">'+esc(n.priority)+'</p>' : '')+
        '</div>').join('') || '<p class="empty">No notes on this round.</p>';

      return '<div class="rev" data-rev="'+esc(r.id)+'">'+
        '<div class="card-head" style="margin-bottom:6px">'+
          '<h3><a href="admin-project.html?id='+esc(r.project_id)+'">'+esc(proj.title||'Project')+'</a>'+
            ' — round '+r.round_no+(who?' · '+esc(who):'')+'</h3>'+
          '<span class="pill '+(r.status==='done'?'ok':(r.status==='in_progress'?'accent':'warn'))+'">'+
            esc(String(r.status).replace('_',' '))+'</span>'+
        '</div>'+
        '<p class="meta">Submitted '+when(r.created_at)+'</p>'+
        notes+
        '<div class="fieldrow" style="margin-top:10px">'+
          '<div class="field half"><label>Status</label>'+
          '<select class="r-status">'+['open','in_progress','done'].map(v =>
            '<option value="'+v+'"'+(v===r.status?' selected':'')+'>'+v.replace('_',' ')+'</option>').join('')+
          '</select></div>'+
        '</div>'+
      '</div>';
    }).join('') : '<p class="empty">No reviews yet. When a client submits one it lands here.</p>';

    $$('.rev').forEach(box => {
      $('.r-status', box).addEventListener('change', async e => {
        const { error } = await sb.from('revision_requests')
          .update({ status: e.target.value }).eq('id', box.getAttribute('data-rev'));
        if(error) alert(error.message); else load();
      });
    });
  }

  await load();

  /* app store reviews: approve or reject, one at a time */
  const whenT = iso => { if(!iso) return 'never'; const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
  let NAMES = {};
  try { const c = await fetch('/catalog.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null); if(c&&c.apps) Object.keys(c.apps).forEach(k=>{ NAMES[k]=c.apps[k].name||k; }); } catch(e){}
  const appName = id => NAMES[id] || id || '—';
  const m = $('#m');
  const { data, error } = await sb.rpc('app_reviews_pending');
  const list = $('#rvlist'), count = $('#rvcount');
  if(error){ list.innerHTML = '<p class="empty">'+esc(error.message)+'</p>'; count.textContent=''; return; }
  const rv = data||[];
  count.textContent = rv.length || 'none waiting'; count.className = 'pill '+(rv.length?'warn':'ok');
  list.innerHTML = rv.length ? '' : '<p class="empty">Nothing waiting.</p>';
  rv.forEach(r => {
    const div = document.createElement('div'); div.className = 'rv-mod';
    div.innerHTML = '<div class="rv-mod-head"><span class="rv-mod-app">'+esc(appName(r.app))+'</span><span class="rv-mod-stars">'+'★'.repeat(r.rating)+'☆'.repeat(5-r.rating)+'</span><span class="rv-mod-who">'+esc(r.name||'No name given')+' · '+whenT(r.created_at)+'</span></div>' +
      '<p class="rv-mod-body"></p><div class="rv-mod-btns"><button class="ok" data-act="approve">Approve</button><button class="no" data-act="reject">Reject</button></div>';
    div.querySelector('.rv-mod-body').textContent = r.body;
    div.querySelectorAll('button').forEach(btn => btn.addEventListener('click', async () => {
      div.querySelectorAll('button').forEach(b=>b.disabled=true);
      const { error } = await sb.rpc('moderate_app_review',{p_id:r.id,p_approve:btn.dataset.act==='approve'});
      if(error){ say(m, error.message, 'err'); div.querySelectorAll('button').forEach(b=>b.disabled=false); return; }
      div.remove(); const left = $$('.rv-mod').length; count.textContent = left||'none waiting'; count.className='pill '+(left?'warn':'ok');
    }));
    list.appendChild(div);
  });
})();
</script>
</body>
</html>
