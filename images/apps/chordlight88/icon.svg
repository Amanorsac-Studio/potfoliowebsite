<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Chordlight 88">
  <!-- The app's own mark: lit bars over a keybed. The three tall bars are
       the notes sounding; the short ones are the keys that are not. -->
  <rect x="2"  y="14.5" width="2.4" height="4"   rx="1.2" fill="#9A7CFF" opacity=".32"/>
  <rect x="5.6" y="9"   width="2.4" height="9.5" rx="1.2" fill="#9A7CFF" opacity=".95"/>
  <rect x="9.2" y="11.5" width="2.4" height="7"  rx="1.2" fill="#9A7CFF" opacity=".32"/>
  <rect x="12.8" y="5.5" width="2.4" height="13" rx="1.2" fill="#C4B0FF"/>
  <rect x="16.4" y="12.5" width="2.4" height="6" rx="1.2" fill="#9A7CFF" opacity=".32"/>
  <rect x="20"  y="8"    width="2.4" height="10.5" rx="1.2" fill="#9A7CFF" opacity=".95"/>
  <rect x="2" y="20.4" width="20.4" height="1.6" rx=".8" fill="#9A7CFF" opacity=".5"/>
</svg>
