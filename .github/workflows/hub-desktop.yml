# Builds the Amanorsac Hub desktop app (hub/) for Windows and macOS.
#
#   - every push that touches hub/ (and manual runs) builds both and
#     tries to keep the installers as workflow artifacts for 30 days
#     (best effort: artifacts count against the account's Actions
#     storage quota, and a full quota must not fail the build)
#   - pushing a tag like hub-v1.0.0 publishes them as assets on a
#     GitHub Release of the same name. Release assets do not count
#     against the Actions storage quota.
#
# macOS signing and notarisation switch on by themselves once these
# repository secrets exist (see hub/README.md, "Signing the Mac app"):
#   MAC_CERT_P12        base64 of the Developer ID Application .p12
#   MAC_CERT_PASSWORD   the password that .p12 was exported with
#   APPLE_ID            the Apple ID of the developer account
#   APPLE_APP_PASSWORD  an app-specific password for that Apple ID
#   APPLE_TEAM_ID       the 10-character team id
# Without them the build is unsigned: right-click the app > Open, or
#   xattr -dr com.apple.quarantine "/Applications/Amanorsac Hub.app"
# Windows signing: CSC_LINK / CSC_KEY_PASSWORD, same as electron-builder documents.

name: Hub desktop app

on:
  push:
    branches: ["**"]
    paths:
      - "hub/**"
      - ".github/workflows/hub-desktop.yml"
    tags:
      - "hub-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also publish a GitHub Release with this tag (e.g. hub-v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

defaults:
  run:
    working-directory: hub

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            script: build:mac
          - os: windows-latest
            name: Windows
            script: build:win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - run: npm ci

      # electron-builder reports a wrong certificate password as an opaque
      # "SecKeychainUnlock" failure deep in the build. This says it plainly,
      # before three minutes of packaging have been spent.
      - name: Check the signing certificate
        if: matrix.name == 'macOS' && secrets.MAC_CERT_P12 != ''
        run: |
          echo "${{ secrets.MAC_CERT_P12 }}" | base64 --decode > /tmp/cert.p12
          if ! openssl pkcs12 -in /tmp/cert.p12 -nokeys -passin pass:"${{ secrets.MAC_CERT_PASSWORD }}" -legacy > /tmp/cert.txt 2>/tmp/cert.err \
             && ! openssl pkcs12 -in /tmp/cert.p12 -nokeys -passin pass:"${{ secrets.MAC_CERT_PASSWORD }}" > /tmp/cert.txt 2>/tmp/cert.err; then
            echo "::error::MAC_CERT_PASSWORD does not open MAC_CERT_P12. Re-set both secrets: the password must be the one given to 'openssl pkcs12 -export', and MAC_CERT_P12 must be the base64 of that exact .p12 file."
            head -3 /tmp/cert.err
            exit 1
          fi
          echo "Certificate opens. Identity:"
          openssl x509 -noout -subject -enddate < /tmp/cert.txt || true
          rm -f /tmp/cert.p12 /tmp/cert.txt

      - name: Build installers
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signing happens only when the certificate is there; an empty
          # CSC_LINK means "unsigned", never a failed build
          CSC_LINK: ${{ matrix.name == 'macOS' && secrets.MAC_CERT_P12 || secrets.WIN_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macOS' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.name == 'macOS' && secrets.MAC_CERT_P12 != '') && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Keep installers
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: amanorsac-hub-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            hub/dist/*.dmg
            hub/dist/*.zip
            hub/dist/*.exe
            hub/dist/*.blockmap

      - name: Publish on the GitHub Release
        if: startsWith(github.ref, 'refs/tags/hub-v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Amanorsac Hub ${{ inputs.release_tag || github.ref_name }}
          body: |
            Amanorsac Hub desktop app.

            - **Windows**: `…-win-x64.exe` is the installer, `…-win-x64-portable.exe` runs without installing.
            - **macOS**: `…-mac-arm64.dmg` for Apple Silicon, `…-mac-x64.dmg` for Intel. Unsigned: right-click the app and choose Open the first time.
          files: |
            hub/dist/*.dmg
            hub/dist/*.zip
            hub/dist/*.exe
            hub/dist/*.blockmap
